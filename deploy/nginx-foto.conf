# foto.dalhus.net -> Foto-containeren på 127.0.0.1:8792.
# certbot --nginx legger til 443/TLS i denne fila.
server {
    server_name foto.dalhus.net;
    server_tokens off;

    # Adresse med punktum til slutt (foto.dalhus.net.) gir «Ikke sikkert» i Safari – send til vanlig adresse.
    if ($http_host !~ ^foto\.dalhus\.net(:443)?$) {
        return 301 https://foto.dalhus.net$request_uri;
    }

    # Store originaler fra Lightroom / nettleseren.
    client_max_body_size 400m;

    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Nedlastinger strømmes rett fra UNAS – ikke mellomlagre i nginx.
    location /download/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    listen 80;
    listen [::]:80;
}
