# foto.dalhus.net – kjører på svs1 i /opt/foto. Lytter bare på 127.0.0.1:8792 (nginx foran).
# network_mode: host gjør at containeren når UNAS over Tailscale (100.x-adressene).
services:
  foto:
    build: ./app
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: 8792
      ORIGIN: https://foto.dalhus.net
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: 1
      BODY_SIZE_LIMIT: 400M
      DATA_DIR: /data
      # E-post (innloggingslenker til gjester) via mail-tjenesten under.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2526
      MAIL_FROM: Eirik Dalhus <noreply@dalhus.net>
    volumes:
      - ./data:/data
    mem_limit: 2g
    cpus: 4

  # Postfix som bare sender (tar ikke imot e-post). Signerer med DKIM; nøkkelen lages første gang i ./mail/dkim,
  # og den offentlige delen (dalhus.net.txt) må legges i DNS som foto._domainkey.dalhus.net.
  mail:
    image: boky/postfix:v5.1.0-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:2526:587
    environment:
      ALLOWED_SENDER_DOMAINS: dalhus.net
      # Må matche serverens reverse-DNS (PTR).
      POSTFIX_myhostname: svs1.dalhus.net
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: foto
    volumes:
      - ./mail/dkim:/etc/opendkim/keys
    mem_limit: 256m
